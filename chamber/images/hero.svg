<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="heroTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="heroTitle">Stylized Abuja skyline over a circuit-board pattern</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#2e4374"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>

  <!-- faint circuit-board texture -->
  <g stroke="#3c4a68" stroke-width="2" opacity="0.5" fill="none">
    <path d="M0 120 H260 V60 H520 V180 H900 V90 H1250 V150 H1600"/>
    <path d="M0 260 H180 V330 H460 V220 H760 V300 H1080 V230 H1600"/>
    <circle cx="260" cy="120" r="6" fill="#3c4a68"/>
    <circle cx="520" cy="180" r="6" fill="#3c4a68"/>
    <circle cx="900" cy="90" r="6" fill="#3c4a68"/>
    <circle cx="1250" cy="150" r="6" fill="#3c4a68"/>
    <circle cx="180" cy="330" r="6" fill="#3c4a68"/>
    <circle cx="760" cy="300" r="6" fill="#3c4a68"/>
  </g>

  <!-- sun / moon disc -->
  <circle cx="1310" cy="150" r="80" fill="#c97a1a" opacity="0.85"/>

  <!-- Aso Rock silhouette -->
  <path d="M120 520 C 220 380, 300 370, 340 460 C 380 380, 460 400, 480 520 Z" fill="#16324f"/>

  <!-- city skyline -->
  <g fill="#0f1f36">
    <rect x="520" y="380" width="70" height="220"/>
    <rect x="600" y="320" width="60" height="280"/>
    <rect x="670" y="420" width="50" height="180"/>
    <rect x="730" y="360" width="80" height="240"/>
    <rect x="820" y="440" width="55" height="160"/>
    <rect x="885" y="300" width="65" height="300"/>
    <rect x="960" y="400" width="70" height="200"/>
    <rect x="1040" y="360" width="50" height="240"/>
    <rect x="1100" y="430" width="90" height="170"/>
    <rect x="1200" y="380" width="55" height="220"/>
  </g>

  <!-- lit windows -->
  <g fill="#d98e2a" opacity="0.85">
    <rect x="535" y="400" width="8" height="8"/>
    <rect x="558" y="430" width="8" height="8"/>
    <rect x="615" y="350" width="8" height="8"/>
    <rect x="638" y="400" width="8" height="8"/>
    <rect x="745" y="390" width="8" height="8"/>
    <rect x="770" y="440" width="8" height="8"/>
    <rect x="900" y="330" width="8" height="8"/>
    <rect x="920" y="380" width="8" height="8"/>
    <rect x="975" y="430" width="8" height="8"/>
    <rect x="1115" y="460" width="8" height="8"/>
    <rect x="1215" y="410" width="8" height="8"/>
  </g>

  <!-- foreground ground -->
  <rect x="0" y="600" width="1600" height="100" fill="#0f1f36"/>
  <path d="M0 600 Q400 560 800 600 T1600 600 V700 H0 Z" fill="#0b1626"/>
</svg>
